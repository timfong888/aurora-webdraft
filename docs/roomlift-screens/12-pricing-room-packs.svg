<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <!-- Card shadow -->
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <!-- Popular card glow -->
    <filter id="popularGlow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#4A90D9" flood-opacity="0.22"/>
    </filter>
    <!-- Banner gradient -->
    <linearGradient id="bannerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#6BB0F0"/>
    </linearGradient>
    <!-- Primary button gradient -->
    <linearGradient id="primaryBtnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BA0E9"/>
      <stop offset="100%" stop-color="#4A90D9"/>
    </linearGradient>
    <!-- Badge gradient -->
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#FFAC33"/>
    </linearGradient>
    <!-- Clip for phone frame -->
    <clipPath id="screenClip">
      <rect x="0" y="0" width="390" height="844" rx="44"/>
    </clipPath>
  </defs>

  <!-- Phone frame -->
  <rect x="0" y="0" width="390" height="844" rx="44" fill="#F8F9FA" stroke="#D1D5DB" stroke-width="1"/>

  <g clip-path="url(#screenClip)">

    <!-- ==================== STATUS BAR ==================== -->
    <rect x="0" y="0" width="390" height="54" fill="#FFFFFF"/>
    <!-- Time -->
    <text x="36" y="36" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E" letter-spacing="0.2">9:41</text>
    <!-- Dynamic Island -->
    <rect x="138" y="8" width="114" height="30" rx="15" fill="#1C1C1E"/>
    <!-- Signal bars -->
    <g transform="translate(286, 22)">
      <rect x="0" y="6" width="3" height="4" rx="0.5" fill="#1C1C1E"/>
      <rect x="5" y="4" width="3" height="6" rx="0.5" fill="#1C1C1E"/>
      <rect x="10" y="2" width="3" height="8" rx="0.5" fill="#1C1C1E"/>
      <rect x="15" y="0" width="3" height="10" rx="0.5" fill="#1C1C1E"/>
    </g>
    <!-- WiFi icon -->
    <g transform="translate(312, 22)">
      <path d="M4 8.5 a1.5 1.5 0 1 1 3 0 a1.5 1.5 0 1 1 -3 0" fill="#1C1C1E"/>
      <path d="M2 5.5 Q5.5 2 9 5.5" stroke="#1C1C1E" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M-0.5 3 Q5.5 -1.5 11.5 3" stroke="#1C1C1E" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Battery -->
    <g transform="translate(336, 22)">
      <rect x="0" y="0" width="25" height="11" rx="2.5" stroke="#1C1C1E" stroke-width="1" fill="none"/>
      <rect x="2" y="2" width="19" height="7" rx="1" fill="#1C1C1E"/>
      <rect x="25.5" y="3" width="2" height="5" rx="1" fill="#1C1C1E"/>
    </g>

    <!-- ==================== HEADER ==================== -->
    <rect x="0" y="54" width="390" height="52" fill="#FFFFFF"/>
    <!-- Back arrow -->
    <g transform="translate(20, 68)">
      <path d="M12 2 L4 10 L12 18" stroke="#4A90D9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Title -->
    <text x="52" y="84" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1C1E" letter-spacing="-0.2">Room Packs</text>
    <!-- Divider -->
    <line x1="0" y1="106" x2="390" y2="106" stroke="#F0F0F0" stroke-width="0.5"/>

    <!-- ==================== FREE ROOM BANNER ==================== -->
    <rect x="20" y="118" width="350" height="52" rx="14" fill="url(#bannerGrad)"/>
    <!-- Sparkle decorations -->
    <circle cx="46" cy="132" r="1.5" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="340" cy="156" r="1" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="355" cy="130" r="1.8" fill="#FFFFFF" opacity="0.35"/>
    <!-- Banner text -->
    <text x="195" y="150" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.1">Your first room is always free &#x2728;</text>

    <!-- ==================== PRICING CARD 1: STARTER PACK ==================== -->
    <rect x="20" y="186" width="350" height="130" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <!-- Card content -->
    <text x="40" y="216" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1C1C1E">Starter Pack</text>
    <!-- Room count and price row -->
    <text x="40" y="242" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#636366">3 Rooms</text>
    <text x="112" y="242" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8E8E93">&#x2014;</text>
    <text x="134" y="242" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1C1E">$4.99</text>
    <text x="200" y="242" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8E8E93">(one-time)</text>
    <!-- Per-room price -->
    <text x="40" y="262" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#4A90D9">$1.66/room</text>
    <!-- Description -->
    <text x="40" y="282" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8E8E93">Perfect for a quick refresh</text>
    <!-- Buy button (outline) -->
    <rect x="272" y="256" width="80" height="36" rx="18" fill="none" stroke="#4A90D9" stroke-width="1.5"/>
    <text x="312" y="279" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#4A90D9" text-anchor="middle">Buy</text>

    <!-- ==================== PRICING CARD 2: HOME PACK (MOST POPULAR) ==================== -->
    <!-- Highlight border -->
    <rect x="18" y="328" width="354" height="150" rx="18" fill="#4A90D9" opacity="0.12"/>
    <!-- Card body -->
    <rect x="20" y="330" width="350" height="146" rx="16" fill="#FFFFFF" stroke="#4A90D9" stroke-width="2" filter="url(#popularGlow)"/>
    <!-- MOST POPULAR badge -->
    <rect x="245" y="322" width="110" height="22" rx="11" fill="url(#badgeGrad)"/>
    <text x="300" y="337" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">MOST POPULAR</text>
    <!-- Card content -->
    <text x="40" y="362" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1C1C1E">Home Pack</text>
    <!-- Room count and price row -->
    <text x="40" y="390" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#636366">10 Rooms</text>
    <text x="118" y="390" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8E8E93">&#x2014;</text>
    <text x="140" y="390" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#1C1C1E">$12.99</text>
    <text x="220" y="390" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8E8E93">(one-time)</text>
    <!-- Per-room price -->
    <text x="40" y="412" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#4A90D9">$1.30/room &#x2014; Best value!</text>
    <!-- Description -->
    <text x="40" y="434" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#636366">Best value &#x2014; do your whole floor</text>
    <!-- Buy button (filled/primary) -->
    <rect x="258" y="406" width="94" height="40" rx="20" fill="url(#primaryBtnGrad)"/>
    <text x="305" y="431" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Buy</text>
    <!-- Subtle recommendation star -->
    <g transform="translate(40, 446)" opacity="0.5">
      <path d="M5 0 L6.1 3.5 L10 3.5 L7 5.7 L8 9.2 L5 7 L2 9.2 L3 5.7 L0 3.5 L3.9 3.5Z" fill="#FF9500" transform="scale(0.7)"/>
      <text x="10" y="5.5" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#FF9500" font-weight="500">Recommended</text>
    </g>

    <!-- ==================== PRICING CARD 3: FULL HOME PACK ==================== -->
    <rect x="20" y="492" width="350" height="130" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <!-- Card content -->
    <text x="40" y="522" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#1C1C1E">Full Home Pack</text>
    <!-- Room count and price row -->
    <text x="40" y="548" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#636366">25 Rooms</text>
    <text x="122" y="548" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8E8E93">&#x2014;</text>
    <text x="144" y="548" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#1C1C1E">$24.99</text>
    <text x="216" y="548" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8E8E93">(one-time)</text>
    <!-- Per-room price -->
    <text x="40" y="568" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#4A90D9">$1.00/room</text>
    <!-- Description -->
    <text x="40" y="588" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8E8E93">Complete home transformation</text>
    <!-- Buy button (outline) -->
    <rect x="272" y="562" width="80" height="36" rx="18" fill="none" stroke="#4A90D9" stroke-width="1.5"/>
    <text x="312" y="585" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#4A90D9" text-anchor="middle">Buy</text>

    <!-- ==================== FEATURES SECTION ==================== -->
    <!-- Section label -->
    <text x="20" y="654" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#8E8E93" letter-spacing="0.6">INCLUDED IN ALL PACKS</text>
    <!-- Divider -->
    <line x1="20" y1="664" x2="370" y2="664" stroke="#E5E5EA" stroke-width="0.5"/>

    <!-- Feature 1 -->
    <text x="40" y="688" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#34C759" font-weight="600">&#x2713;</text>
    <text x="60" y="688" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3A3A3C">Unlimited refinements per room</text>

    <!-- Feature 2 -->
    <text x="40" y="714" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#34C759" font-weight="600">&#x2713;</text>
    <text x="60" y="714" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3A3A3C">Shoppable product links</text>

    <!-- Feature 3 -->
    <text x="40" y="740" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#34C759" font-weight="600">&#x2713;</text>
    <text x="60" y="740" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3A3A3C">Shareable Reveal Cards</text>

    <!-- Feature 4 -->
    <text x="40" y="766" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#34C759" font-weight="600">&#x2713;</text>
    <text x="60" y="766" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3A3A3C">Rooms never expire</text>

    <!-- Feature 5 -->
    <text x="40" y="792" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#34C759" font-weight="600">&#x2713;</text>
    <text x="60" y="792" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#3A3A3C">Watermark-free on any paid pack</text>

    <!-- ==================== BOTTOM TRUST NOTE ==================== -->
    <!-- Lock icon -->
    <g transform="translate(108, 812)">
      <rect x="2" y="4" width="8" height="7" rx="1.5" fill="none" stroke="#8E8E93" stroke-width="1.2"/>
      <path d="M3.5 4 L3.5 2.5 A2.5 2.5 0 0 1 8.5 2.5 L8.5 4" fill="none" stroke="#8E8E93" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <text x="195" y="823" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8E8E93" text-anchor="middle">One-time purchase &#xB7; No subscription &#xB7; No hidden fees</text>

  </g>
</svg>