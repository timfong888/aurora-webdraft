<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <!-- Clip for phone rounded corners -->
    <clipPath id="phoneClip">
      <rect width="390" height="844" rx="44" ry="44"/>
    </clipPath>
    <!-- Shadow filter -->
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00000012"/>
    </filter>
    <filter id="softShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#00000010"/>
    </filter>
    <filter id="sliderShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <!-- Gradient for before/after overlay -->
    <linearGradient id="beforeOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="afterOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Clip for before side -->
    <clipPath id="beforeClip">
      <rect x="20" y="138" width="175" height="240" rx="12" ry="12"/>
    </clipPath>
    <!-- Clip for after side -->
    <clipPath id="afterClip">
      <rect x="195" y="138" width="175" height="240" rx="12" ry="12"/>
    </clipPath>
    <!-- Full comparison area clip -->
    <clipPath id="compClip">
      <rect x="20" y="138" width="350" height="240" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <!-- Phone body background -->
  <rect width="390" height="844" rx="44" ry="44" fill="#F5F2EE"/>

  <g clip-path="url(#phoneClip)">

    <!-- ============ STATUS BAR ============ -->
    <rect x="0" y="0" width="390" height="54" fill="#F5F2EE"/>
    <!-- Time -->
    <text x="36" y="36" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E" text-anchor="start">9:41</text>
    <!-- Dynamic Island -->
    <rect x="148" y="10" width="94" height="28" rx="14" fill="#1C1C1E"/>
    <!-- Signal bars -->
    <g transform="translate(302, 22)">
      <rect x="0" y="8" width="3" height="4" rx="1" fill="#1C1C1E"/>
      <rect x="5" y="5" width="3" height="7" rx="1" fill="#1C1C1E"/>
      <rect x="10" y="2" width="3" height="10" rx="1" fill="#1C1C1E"/>
      <rect x="15" y="0" width="3" height="12" rx="1" fill="#1C1C1E"/>
    </g>
    <!-- WiFi -->
    <g transform="translate(328, 22)">
      <path d="M4 10 L8 10 L6 6 Z" fill="#1C1C1E"/>
      <path d="M2 8 L10 8 L6 3 Z" fill="#1C1C1E" opacity="0.9"/>
    </g>
    <!-- Battery -->
    <g transform="translate(344, 24)">
      <rect x="0" y="0" width="24" height="11" rx="2.5" stroke="#1C1C1E" stroke-width="1" fill="none"/>
      <rect x="25" y="3" width="2" height="5" rx="1" fill="#1C1C1E" opacity="0.4"/>
      <rect x="1.5" y="1.5" width="18" height="8" rx="1.5" fill="#1C1C1E"/>
    </g>

    <!-- ============ HEADER ============ -->
    <rect x="0" y="54" width="390" height="56" fill="#F5F2EE"/>
    <!-- Back arrow -->
    <g transform="translate(20, 74)">
      <path d="M12 0 L0 10 L12 20" stroke="#C4763A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Title -->
    <text x="195" y="88" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="18" font-weight="700" fill="#1C1C1E" text-anchor="middle">Your Design Plan</text>
    <!-- Share icon -->
    <g transform="translate(345, 70)">
      <rect x="4" y="10" width="18" height="14" rx="3" stroke="#C4763A" stroke-width="1.8" fill="none"/>
      <path d="M13 18 L13 4 M8 8 L13 3 L18 8" stroke="#C4763A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Thin separator -->
    <line x1="20" y1="114" x2="370" y2="114" stroke="#E8E0D8" stroke-width="0.5"/>

    <!-- ============ OPTION TABS ============ -->
    <g transform="translate(20, 118)">
      <!-- Option A - active -->
      <rect x="0" y="0" width="80" height="30" rx="8" fill="#C4763A"/>
      <text x="40" y="20" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Option A</text>
      <!-- Option B - inactive -->
      <rect x="90" y="0" width="80" height="30" rx="8" fill="#E8E0D8"/>
      <text x="130" y="20" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="middle">Option B</text>
    </g>

    <!-- ============ BEFORE/AFTER COMPARISON ============ -->
    <!-- Card background -->
    <rect x="20" y="158" width="350" height="260" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- ---- BEFORE SIDE (left half) ---- -->
    <clipPath id="leftHalf">
      <rect x="20" y="158" width="175" height="260"/>
    </clipPath>
    <g clip-path="url(#leftHalf)">
      <!-- Room background - warm beige walls -->
      <rect x="20" y="158" width="350" height="260" rx="16" fill="#E8DDD0"/>
      <!-- Floor -->
      <rect x="20" y="328" width="350" height="90" fill="#C9B99A"/>
      <!-- Floor line -->
      <line x1="20" y1="328" x2="370" y2="328" stroke="#B8A888" stroke-width="1"/>

      <!-- Messy room items - cluttered arrangement -->
      <!-- Tilted bookshelf -->
      <rect x="36" y="210" width="40" height="118" rx="3" fill="#8B6F4E" transform="rotate(-4, 56, 269)"/>
      <rect x="40" y="218" width="32" height="8" rx="1" fill="#A0845E"/>
      <rect x="40" y="232" width="32" height="8" rx="1" fill="#A0845E"/>
      <rect x="40" y="246" width="32" height="8" rx="1" fill="#A0845E"/>
      <!-- Books scattered on shelf, messy -->
      <rect x="42" y="220" width="6" height="7" fill="#D4564E"/>
      <rect x="50" y="219" width="5" height="8" fill="#4A7FB5" transform="rotate(8,52,223)"/>
      <rect x="57" y="221" width="7" height="6" fill="#6AAB6E"/>
      <rect x="42" y="234" width="8" height="6" fill="#D4A04E"/>
      <rect x="53" y="233" width="5" height="7" fill="#9B6EAB" transform="rotate(-5,55,236)"/>
      <rect x="42" y="248" width="5" height="6" fill="#4A7FB5"/>
      <rect x="49" y="249" width="7" height="5" fill="#D4564E"/>

      <!-- Cluttered coffee table -->
      <rect x="88" y="330" width="80" height="40" rx="3" fill="#7A5E3E"/>
      <rect x="88" y="326" width="80" height="8" rx="2" fill="#8B6F4E"/>
      <!-- Items scattered on coffee table -->
      <rect x="94" y="314" width="22" height="14" rx="2" fill="#5C8BC4"/>
      <rect x="120" y="316" width="15" height="10" rx="1" fill="#E8C84E"/>
      <rect x="138" y="312" width="18" height="16" rx="2" fill="#D4564E" transform="rotate(12,147,320)"/>
      <rect x="100" y="308" width="8" height="8" rx="4" fill="#9B6EAB"/>
      <rect x="150" y="318" width="10" height="6" rx="1" fill="#6AAB6E"/>

      <!-- Misplaced accent chair -->
      <rect x="108" y="248" width="50" height="48" rx="6" fill="#B5796A"/>
      <rect x="108" y="240" width="50" height="14" rx="4" fill="#C4897A"/>
      <rect x="104" y="248" width="8" height="48" rx="3" fill="#A8695A"/>

      <!-- Random items on floor -->
      <rect x="42" y="345" width="30" height="22" rx="3" fill="#D4A04E" transform="rotate(-8,57,356)"/>
      <rect x="165" y="350" width="16" height="20" rx="2" fill="#5C8BC4"/>
      <rect x="148" y="360" width="24" height="12" rx="2" fill="#8B6F4E"/>

      <!-- Dim/warm lighting overlay -->
      <rect x="20" y="158" width="175" height="260" fill="#000000" opacity="0.06"/>
    </g>

    <!-- ---- AFTER SIDE (right half) ---- -->
    <clipPath id="rightHalf">
      <rect x="195" y="158" width="175" height="260"/>
    </clipPath>
    <g clip-path="url(#rightHalf)">
      <!-- Room background - fresh light walls -->
      <rect x="20" y="158" width="350" height="260" rx="16" fill="#F0E8DC"/>
      <!-- Floor -->
      <rect x="20" y="328" width="350" height="90" fill="#D4C4A8"/>
      <line x1="20" y1="328" x2="370" y2="328" stroke="#C4B498" stroke-width="1"/>

      <!-- Organized bookshelf - on east wall (right side), straight -->
      <rect x="310" y="200" width="44" height="128" rx="3" fill="#8B6F4E"/>
      <rect x="314" y="208" width="36" height="8" rx="1" fill="#A0845E"/>
      <rect x="314" y="224" width="36" height="8" rx="1" fill="#A0845E"/>
      <rect x="314" y="240" width="36" height="8" rx="1" fill="#A0845E"/>
      <rect x="314" y="256" width="36" height="8" rx="1" fill="#A0845E"/>
      <!-- Neatly arranged books -->
      <rect x="316" y="210" width="5" height="6" fill="#D4564E"/>
      <rect x="322" y="210" width="5" height="6" fill="#4A7FB5"/>
      <rect x="328" y="210" width="5" height="6" fill="#6AAB6E"/>
      <rect x="334" y="210" width="5" height="6" fill="#D4A04E"/>
      <rect x="316" y="226" width="5" height="6" fill="#9B6EAB"/>
      <rect x="322" y="226" width="5" height="6" fill="#D4564E"/>
      <rect x="328" y="226" width="5" height="6" fill="#4A7FB5"/>
      <rect x="316" y="242" width="5" height="6" fill="#6AAB6E"/>
      <rect x="322" y="242" width="5" height="6" fill="#D4A04E"/>
      <rect x="328" y="242" width="5" height="6" fill="#9B6EAB"/>
      <!-- Small plant on top -->
      <rect x="324" y="192" width="12" height="8" rx="2" fill="#6AAB6E"/>
      <rect x="328" y="186" width="4" height="8" rx="1" fill="#5A9B5E"/>

      <!-- Clean coffee table replaced with storage ottoman -->
      <rect x="228" y="332" width="70" height="36" rx="8" fill="#A8B4A0"/>
      <rect x="228" y="328" width="70" height="10" rx="5" fill="#B8C4B0"/>

      <!-- New accent chair - modern -->
      <rect x="220" y="248" width="52" height="48" rx="8" fill="#7BAAB8"/>
      <rect x="220" y="240" width="52" height="14" rx="6" fill="#8BBAC8"/>
      <rect x="216" y="252" width="8" height="40" rx="3" fill="#6A9AA8"/>
      <!-- Throw pillow -->
      <rect x="232" y="252" width="18" height="14" rx="4" fill="#E8D4B0"/>

      <!-- Floor lamp in reading corner -->
      <rect x="208" y="180" width="4" height="148" rx="2" fill="#3C3C3C"/>
      <path d="M196 180 L210 180 L224 180 L218 168 L202 168 Z" fill="#E8D4B0"/>
      <circle cx="210" cy="174" r="3" fill="#FFF4D4" opacity="0.8"/>
      <!-- Lamp glow -->
      <circle cx="210" cy="200" r="30" fill="#FFF4D4" opacity="0.08"/>

      <!-- Small rug under reading area -->
      <ellipse cx="238" cy="380" rx="50" ry="16" fill="#D4C4B0" opacity="0.5"/>

      <!-- Bright/fresh overlay -->
      <rect x="195" y="158" width="175" height="260" fill="#FFFFFF" opacity="0.04"/>
    </g>

    <!-- ---- DIVIDER LINE ---- -->
    <line x1="195" y1="158" x2="195" y2="418" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Slider handle -->
    <circle cx="195" cy="288" r="16" fill="#FFFFFF" filter="url(#sliderShadow)"/>
    <circle cx="195" cy="288" r="14" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <!-- Arrow indicators on handle -->
    <path d="M189 285 L186 288 L189 291" stroke="#C4763A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M201 285 L204 288 L201 291" stroke="#C4763A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Before/After labels -->
    <g>
      <rect x="36" y="168" width="56" height="22" rx="6" fill="#00000066"/>
      <text x="64" y="183" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Before</text>
    </g>
    <g>
      <rect x="298" y="168" width="48" height="22" rx="6" fill="#00000044"/>
      <text x="322" y="183" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">After</text>
    </g>

    <!-- ============ RECOMMENDED ACTIONS SECTION ============ -->
    <!-- Section header -->
    <text x="20" y="450" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="17" font-weight="700" fill="#1C1C1E">Recommended Actions</text>
    <text x="218" y="450" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="14" font-weight="400" fill="#8E8E93">(6 actions)</text>

    <!-- ---- Action Item 1 ---- -->
    <rect x="20" y="464" width="350" height="72" rx="14" fill="#FFFFFF" filter="url(#softShadow)"/>
    <!-- Checkbox - checked -->
    <rect x="36" y="486" width="22" height="22" rx="6" fill="#C4763A"/>
    <path d="M42 497 L46 501 L54 492" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Icon -->
    <text x="72" y="502" font-family="-apple-system, sans-serif" font-size="18">&#x1F504;</text>
    <!-- Text -->
    <text x="96" y="493" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="14" font-weight="500" fill="#1C1C1E">Move bookshelf to east wall</text>
    <!-- Tag: Reorganize (green) -->
    <rect x="96" y="500" width="78" height="22" rx="6" fill="#E8F5E8"/>
    <text x="135" y="515" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="600" fill="#2D8A4E" text-anchor="middle">Reorganize</text>

    <!-- ---- Action Item 2 ---- -->
    <rect x="20" y="544" width="350" height="72" rx="14" fill="#FFFFFF" filter="url(#softShadow)"/>
    <!-- Checkbox - checked -->
    <rect x="36" y="566" width="22" height="22" rx="6" fill="#C4763A"/>
    <path d="M42 577 L46 581 L54 572" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Icon -->
    <text x="72" y="582" font-family="-apple-system, sans-serif" font-size="18">&#x1F4E6;</text>
    <!-- Text -->
    <text x="96" y="571" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="14" font-weight="500" fill="#1C1C1E">Clear coffee table &#x2014; use storage ottoman</text>
    <!-- Tag: Reorganize (green) -->
    <rect x="96" y="578" width="78" height="22" rx="6" fill="#E8F5E8"/>
    <text x="135" y="593" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="600" fill="#2D8A4E" text-anchor="middle">Reorganize</text>

    <!-- ---- Action Item 3 ---- -->
    <rect x="20" y="624" width="350" height="72" rx="14" fill="#FFFFFF" filter="url(#softShadow)"/>
    <!-- Checkbox - unchecked -->
    <rect x="36" y="646" width="22" height="22" rx="6" fill="none" stroke="#D1D1D6" stroke-width="1.5"/>
    <!-- Icon -->
    <text x="72" y="662" font-family="-apple-system, sans-serif" font-size="18">&#x1F6CB;&#xFE0F;</text>
    <!-- Text -->
    <text x="96" y="651" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="14" font-weight="500" fill="#1C1C1E">Replace accent chair</text>
    <!-- Tag: Purchase (blue) -->
    <rect x="96" y="658" width="68" height="22" rx="6" fill="#E3EEFB"/>
    <text x="130" y="673" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="600" fill="#3478F6" text-anchor="middle">Purchase</text>
    <!-- Price -->
    <text x="346" y="659" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="700" fill="#1C1C1E" text-anchor="end">$189</text>

    <!-- ---- Action Item 4 ---- -->
    <rect x="20" y="704" width="350" height="72" rx="14" fill="#FFFFFF" filter="url(#softShadow)"/>
    <!-- Checkbox - unchecked -->
    <rect x="36" y="726" width="22" height="22" rx="6" fill="none" stroke="#D1D1D6" stroke-width="1.5"/>
    <!-- Icon -->
    <text x="72" y="742" font-family="-apple-system, sans-serif" font-size="18">&#x1F4A1;</text>
    <!-- Text -->
    <text x="96" y="731" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="14" font-weight="500" fill="#1C1C1E">Add floor lamp in reading corner</text>
    <!-- Tag: Purchase (blue) -->
    <rect x="96" y="738" width="68" height="22" rx="6" fill="#E3EEFB"/>
    <text x="130" y="753" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="600" fill="#3478F6" text-anchor="middle">Purchase</text>
    <!-- Price -->
    <text x="346" y="739" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="700" fill="#1C1C1E" text-anchor="end">$79</text>

    <!-- ============ BOTTOM BAR ============ -->
    <!-- Bottom bar background -->
    <rect x="0" y="784" width="390" height="60" fill="#F5F2EE"/>
    <line x1="0" y1="784" x2="390" y2="784" stroke="#E8E0D8" stroke-width="0.5"/>

    <!-- Refine button (secondary) -->
    <rect x="20" y="794" width="160" height="44" rx="12" fill="none" stroke="#C4763A" stroke-width="1.8"/>
    <text x="100" y="822" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="16" font-weight="600" fill="#C4763A" text-anchor="middle">Refine</text>

    <!-- Accept Plan button (primary) -->
    <rect x="192" y="794" width="178" height="44" rx="12" fill="#3478F6"/>
    <text x="281" y="822" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Accept Plan</text>

    <!-- Home indicator -->
    <rect x="145" y="836" width="100" height="5" rx="2.5" fill="#1C1C1E" opacity="0.15"/>

  </g>

  <!-- Phone outline -->
  <rect width="390" height="844" rx="44" ry="44" fill="none" stroke="#D1D1D6" stroke-width="1"/>

</svg>