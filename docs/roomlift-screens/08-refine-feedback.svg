<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <!-- Warm gradient background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9F5"/>
      <stop offset="100%" stop-color="#FFF5EE"/>
    </linearGradient>
    <!-- Blue user bubble gradient -->
    <linearGradient id="userBubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4956B"/>
      <stop offset="100%" stop-color="#C07A50"/>
    </linearGradient>
    <!-- Thumbnail overlay gradient -->
    <linearGradient id="thumbOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Input bar shadow -->
    <filter id="inputShadow" x="-5%" y="-50%" width="110%" height="200%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <!-- Card shadow -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <!-- Thumbnail image shadow -->
    <filter id="thumbShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <!-- Chip shadow -->
    <filter id="chipShadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <!-- Mic button gradient -->
    <linearGradient id="micGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4956B"/>
      <stop offset="100%" stop-color="#B8764D"/>
    </linearGradient>
    <!-- Room scene colors -->
    <linearGradient id="wallColor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E6D3"/>
      <stop offset="100%" stop-color="#EDD9C4"/>
    </linearGradient>
    <linearGradient id="wallColorWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D4B8"/>
      <stop offset="100%" stop-color="#E8C4A0"/>
    </linearGradient>
    <linearGradient id="floorColor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A882"/>
      <stop offset="100%" stop-color="#B89870"/>
    </linearGradient>
    <!-- Typing indicator pulse -->
    <style>
      @keyframes pulse1 { 0%,100%{opacity:0.3} 33%{opacity:1} }
      @keyframes pulse2 { 0%,100%{opacity:0.3} 50%{opacity:1} }
      @keyframes pulse3 { 0%,100%{opacity:0.3} 66%{opacity:1} }
    </style>
  </defs>

  <!-- Phone frame background -->
  <rect width="390" height="844" rx="0" fill="url(#bgGrad)"/>

  <!-- ==================== STATUS BAR ==================== -->
  <rect x="0" y="0" width="390" height="54" fill="#FFFAF7"/>
  <!-- Time -->
  <text x="36" y="36" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="600" fill="#1C1C1E" letter-spacing="0.2">9:41</text>
  <!-- Dynamic Island -->
  <rect x="148" y="10" width="94" height="28" rx="14" fill="#1C1C1E"/>
  <!-- Signal bars -->
  <g transform="translate(290,22)">
    <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#1C1C1E"/>
    <rect x="5" y="5" width="3" height="7" rx="0.5" fill="#1C1C1E"/>
    <rect x="10" y="2" width="3" height="10" rx="0.5" fill="#1C1C1E"/>
    <rect x="15" y="0" width="3" height="12" rx="0.5" fill="#1C1C1E"/>
  </g>
  <!-- WiFi icon -->
  <g transform="translate(315,22)">
    <path d="M4 8.5 a1.5 1.5 0 1 1 3 0 a1.5 1.5 0 1 1 -3 0" fill="#1C1C1E"/>
    <path d="M1.5 5.5 Q5.5 1.5 9.5 5.5" stroke="#1C1C1E" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M-1 3 Q5.5 -2 12 3" stroke="#1C1C1E" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Battery -->
  <g transform="translate(338,22)">
    <rect x="0" y="0" width="24" height="12" rx="3" stroke="#1C1C1E" stroke-width="1" fill="none"/>
    <rect x="2" y="2" width="18" height="8" rx="1.5" fill="#1C1C1E"/>
    <rect x="25" y="3" width="2" height="6" rx="1" fill="#1C1C1E"/>
  </g>

  <!-- ==================== HEADER ==================== -->
  <rect x="0" y="54" width="390" height="52" fill="#FFFAF7"/>
  <!-- Back arrow -->
  <g transform="translate(20,72)">
    <path d="M12 2 L4 10 L12 18" stroke="#C07A50" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Header title -->
  <text x="52" y="84" font-family="-apple-system,SF Pro Display,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="700" fill="#2C2C2E">Refine Your Design</text>
  <!-- Step indicator -->
  <text x="330" y="84" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="500" fill="#A0937D">8 of 12</text>
  <!-- Header separator -->
  <line x1="0" y1="106" x2="390" y2="106" stroke="#F0E6DC" stroke-width="0.5"/>

  <!-- ==================== CURRENT DESIGN THUMBNAIL ==================== -->
  <g transform="translate(20,116)" filter="url(#thumbShadow)">
    <rect width="350" height="80" rx="14" fill="#F5E6D3"/>
    <!-- Miniature room scene in thumbnail -->
    <clipPath id="thumbClip">
      <rect width="350" height="80" rx="14"/>
    </clipPath>
    <g clip-path="url(#thumbClip)">
      <!-- Wall -->
      <rect width="350" height="55" fill="url(#wallColor)"/>
      <!-- Floor -->
      <rect y="55" width="350" height="25" fill="url(#floorColor)"/>
      <!-- Window -->
      <rect x="140" y="8" width="70" height="40" rx="2" fill="#D4E8F0" stroke="#C9B89A" stroke-width="1.5"/>
      <line x1="175" y1="8" x2="175" y2="48" stroke="#C9B89A" stroke-width="1"/>
      <line x1="140" y1="28" x2="210" y2="28" stroke="#C9B89A" stroke-width="1"/>
      <!-- Shelf on wall -->
      <rect x="30" y="22" width="80" height="4" rx="1" fill="#A0866A"/>
      <rect x="40" y="12" width="10" height="10" rx="1" fill="#8BC49E"/>
      <rect x="58" y="8" width="8" height="14" rx="1" fill="#D4956B"/>
      <rect x="74" y="14" width="12" height="8" rx="4" fill="#E8C4A0"/>
      <!-- Shelf right side -->
      <rect x="240" y="18" width="80" height="4" rx="1" fill="#A0866A"/>
      <rect x="250" y="8" width="8" height="10" rx="1" fill="#7BAFD4"/>
      <rect x="268" y="6" width="10" height="12" rx="1" fill="#D4956B"/>
      <rect x="290" y="10" width="14" height="8" rx="4" fill="#E8D4B8"/>
      <!-- Couch -->
      <rect x="100" y="48" width="150" height="22" rx="4" fill="#B8764D"/>
      <rect x="105" y="50" width="65" height="16" rx="3" fill="#C9896A"/>
      <rect x="180" y="50" width="65" height="16" rx="3" fill="#C9896A"/>
      <!-- Pillows -->
      <ellipse cx="120" cy="52" rx="10" ry="7" fill="#E8D4B8"/>
      <ellipse cx="230" cy="52" rx="10" ry="7" fill="#D4E8D0"/>
      <!-- Plant -->
      <rect x="290" y="45" width="14" height="18" rx="3" fill="#8B7355"/>
      <ellipse cx="297" cy="42" rx="16" ry="14" fill="#6BA87A"/>
      <ellipse cx="290" cy="38" rx="10" ry="10" fill="#7DC08E"/>
      <!-- Rug -->
      <ellipse cx="175" cy="70" rx="60" ry="8" fill="#D4A574" opacity="0.5"/>
    </g>
    <!-- Overlay label -->
    <rect x="8" y="56" width="100" height="20" rx="10" fill="#1C1C1E" opacity="0.6"/>
    <text x="16" y="70" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Current Design</text>
    <!-- Edit badge -->
    <rect x="280" y="56" width="60" height="20" rx="10" fill="#C07A50"/>
    <text x="293" y="70" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Option A</text>
  </g>

  <!-- ==================== CHAT AREA ==================== -->
  <!-- System message 1 -->
  <g transform="translate(20,214)">
    <!-- Avatar -->
    <circle cx="16" cy="16" r="16" fill="#E8D4C0"/>
    <text x="16" y="21" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="700" fill="#C07A50" text-anchor="middle">R</text>
    <!-- Bubble -->
    <rect x="40" y="0" width="270" height="46" rx="18" fill="#F5EDE5"/>
    <rect x="40" y="0" width="270" height="46" rx="18" fill="none" stroke="#EDE0D2" stroke-width="0.5"/>
    <!-- Bubble tail -->
    <path d="M40 30 L32 36 L40 34" fill="#F5EDE5"/>
    <text x="58" y="19" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#4A4A4A" font-weight="400">Here's Option A. What would</text>
    <text x="58" y="37" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#4A4A4A" font-weight="400">you like to change?</text>
    <!-- Timestamp -->
    <text x="280" y="58" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#B0A090" text-anchor="end">2:14 PM</text>
  </g>

  <!-- User message -->
  <g transform="translate(20,290)">
    <!-- Bubble aligned right -->
    <rect x="40" y="0" width="330" height="62" rx="18" fill="url(#userBubble)"/>
    <!-- Bubble tail right -->
    <path d="M370 40 L378 46 L370 44" fill="#C07A50"/>
    <text x="58" y="19" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#FFFFFF" font-weight="400">I like the shelf placement but can</text>
    <text x="58" y="37" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#FFFFFF" font-weight="400">we try a warmer color palette?</text>
    <!-- Read receipt -->
    <g transform="translate(340,50)">
      <path d="M0 4 L3 7 L8 1" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
      <path d="M5 4 L8 7 L13 1" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    </g>
    <text x="338" y="58" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#B0A090" text-anchor="end">2:14 PM</text>
  </g>

  <!-- System message 2: Generating -->
  <g transform="translate(20,370)">
    <!-- Avatar -->
    <circle cx="16" cy="16" r="16" fill="#E8D4C0"/>
    <text x="16" y="21" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="700" fill="#C07A50" text-anchor="middle">R</text>
    <!-- Bubble -->
    <rect x="40" y="0" width="280" height="34" rx="17" fill="#F5EDE5"/>
    <rect x="40" y="0" width="280" height="34" rx="17" fill="none" stroke="#EDE0D2" stroke-width="0.5"/>
    <path d="M40 20 L32 26 L40 24" fill="#F5EDE5"/>
    <text x="58" y="22" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#4A4A4A" font-weight="400">Got it! Generating a warmer version...</text>
    <!-- Sparkle icon -->
    <g transform="translate(290,10)">
      <path d="M8 0 L9.5 5.5 L15 7 L9.5 8.5 L8 14 L6.5 8.5 L1 7 L6.5 5.5 Z" fill="#D4956B" opacity="0.6"/>
    </g>
  </g>

  <!-- Updated thumbnail (refined result with warmer tones) -->
  <g transform="translate(60,418)" filter="url(#thumbShadow)">
    <rect width="310" height="110" rx="14" fill="#F0D4B8"/>
    <clipPath id="refinedClip">
      <rect width="310" height="110" rx="14"/>
    </clipPath>
    <g clip-path="url(#refinedClip)">
      <!-- Warmer wall -->
      <rect width="310" height="75" fill="url(#wallColorWarm)"/>
      <!-- Warmer floor -->
      <rect y="75" width="310" height="35" fill="#C4996E"/>
      <!-- Window -->
      <rect x="120" y="10" width="70" height="48" rx="2" fill="#E8D4B8" stroke="#B89870" stroke-width="1.5"/>
      <line x1="155" y1="10" x2="155" y2="58" stroke="#B89870" stroke-width="1"/>
      <line x1="120" y1="34" x2="190" y2="34" stroke="#B89870" stroke-width="1"/>
      <!-- Warm light from window -->
      <ellipse cx="155" cy="50" rx="50" ry="20" fill="#F5D4A8" opacity="0.2"/>
      <!-- Shelf left -->
      <rect x="20" y="28" width="75" height="5" rx="1.5" fill="#96734F"/>
      <rect x="30" y="16" width="10" height="12" rx="1" fill="#D4956B"/>
      <rect x="48" y="12" width="8" height="16" rx="1" fill="#E8A060"/>
      <rect x="64" y="18" width="12" height="10" rx="4" fill="#F0C898"/>
      <!-- Shelf right -->
      <rect x="215" y="24" width="75" height="5" rx="1.5" fill="#96734F"/>
      <rect x="225" y="12" width="8" height="12" rx="1" fill="#D4956B"/>
      <rect x="242" y="10" width="10" height="14" rx="1" fill="#E8A060"/>
      <rect x="264" y="14" width="14" height="10" rx="4" fill="#F0D0A0"/>
      <!-- Couch warmer -->
      <rect x="75" y="62" width="160" height="26" rx="5" fill="#B06830"/>
      <rect x="80" y="64" width="70" height="20" rx="4" fill="#C88050"/>
      <rect x="160" y="64" width="70" height="20" rx="4" fill="#C88050"/>
      <!-- Warm pillows -->
      <ellipse cx="100" cy="68" rx="11" ry="8" fill="#F0C898"/>
      <ellipse cx="210" cy="68" rx="11" ry="8" fill="#E8A060"/>
      <!-- Plant -->
      <rect x="260" y="58" width="16" height="22" rx="4" fill="#7A5E3A"/>
      <ellipse cx="268" cy="54" rx="18" ry="16" fill="#5A9060"/>
      <ellipse cx="260" cy="50" rx="12" ry="12" fill="#6CA870"/>
      <!-- Warm rug -->
      <ellipse cx="155" cy="94" rx="65" ry="10" fill="#D48840" opacity="0.4"/>
      <!-- Warm ambient glow -->
      <rect width="310" height="110" fill="#F0A050" opacity="0.05"/>
    </g>
    <!-- Updated label -->
    <rect x="8" y="82" width="108" height="22" rx="11" fill="#1C1C1E" opacity="0.65"/>
    <text x="16" y="97" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Updated Design</text>
    <!-- Warmer badge -->
    <rect x="228" y="82" width="72" height="22" rx="11" fill="#D4956B"/>
    <text x="243" y="97" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Warmer</text>
    <!-- Checkmark overlay -->
    <circle cx="290" cy="20" r="12" fill="#5A9060" opacity="0.9"/>
    <path d="M284 20 L288 24 L296 16" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- System message 3: Confirmation -->
  <g transform="translate(20,544)">
    <!-- Avatar -->
    <circle cx="16" cy="16" r="16" fill="#E8D4C0"/>
    <text x="16" y="21" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="700" fill="#C07A50" text-anchor="middle">R</text>
    <!-- Bubble -->
    <rect x="40" y="0" width="300" height="46" rx="18" fill="#F5EDE5"/>
    <rect x="40" y="0" width="300" height="46" rx="18" fill="none" stroke="#EDE0D2" stroke-width="0.5"/>
    <path d="M40 30 L32 36 L40 34" fill="#F5EDE5"/>
    <text x="58" y="19" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#4A4A4A" font-weight="400">Here's your updated design with</text>
    <text x="58" y="37" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="14" fill="#4A4A4A" font-weight="400">warmer tones. How does it look?</text>
    <text x="310" y="58" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="10" fill="#B0A090" text-anchor="end">2:15 PM</text>
  </g>

  <!-- Unlimited refinements note -->
  <g transform="translate(0,612)">
    <rect x="130" y="0" width="130" height="22" rx="11" fill="#F0E6DC"/>
    <text x="195" y="15" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="10" font-weight="500" fill="#A0937D" text-anchor="middle">Unlimited refinements</text>
  </g>

  <!-- ==================== QUICK FEEDBACK CHIPS ==================== -->
  <g transform="translate(0,648)">
    <!-- Scrollable chips row -->
    <rect x="14" y="0" width="82" height="34" rx="17" fill="#FFFFFF" filter="url(#chipShadow)" stroke="#EDE0D2" stroke-width="1"/>
    <text x="55" y="22" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="500" fill="#C07A50" text-anchor="middle">More color</text>

    <rect x="104" y="0" width="92" height="34" rx="17" fill="#FFFFFF" filter="url(#chipShadow)" stroke="#EDE0D2" stroke-width="1"/>
    <text x="150" y="22" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="500" fill="#C07A50" text-anchor="middle">Less clutter</text>

    <rect x="204" y="0" width="106" height="34" rx="17" fill="#FFFFFF" filter="url(#chipShadow)" stroke="#EDE0D2" stroke-width="1"/>
    <text x="257" y="22" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="500" fill="#C07A50" text-anchor="middle">Different style</text>

    <rect x="318" y="0" width="62" height="34" rx="17" fill="#D4956B" filter="url(#chipShadow)"/>
    <text x="349" y="22" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Love it!</text>
  </g>

  <!-- ==================== INPUT AREA ==================== -->
  <g transform="translate(0,698)" filter="url(#inputShadow)">
    <!-- Input background -->
    <rect x="0" y="0" width="390" height="146" fill="#FFFAF7"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#F0E6DC" stroke-width="0.5"/>

    <!-- Text input field -->
    <rect x="16" y="16" width="268" height="46" rx="23" fill="#F5EDE5" stroke="#E8D4C0" stroke-width="1"/>
    <!-- Placeholder text -->
    <text x="44" y="44" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="15" fill="#B0A090" font-weight="400">Type your feedback...</text>
    <!-- Small attachment icon in input -->
    <g transform="translate(24,30)">
      <circle cx="8" cy="8" r="8" fill="none"/>
      <path d="M8 3 L8 13 M3 8 L13 8" stroke="#C0A890" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Microphone button -->
    <circle cx="308" cy="39" r="23" fill="url(#micGrad)"/>
    <!-- Mic icon -->
    <g transform="translate(298,26)">
      <!-- Mic body -->
      <rect x="6" y="0" width="8" height="14" rx="4" fill="#FFFFFF"/>
      <!-- Mic stand -->
      <path d="M4 10 Q4 18 10 18 Q16 18 16 10" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <line x1="10" y1="18" x2="10" y2="23" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="6" y1="23" x2="14" y2="23" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Pulse ring around mic -->
    <circle cx="308" cy="39" r="23" fill="none" stroke="#D4956B" stroke-width="1" opacity="0.4"/>
    <circle cx="308" cy="39" r="28" fill="none" stroke="#D4956B" stroke-width="0.5" opacity="0.2"/>

    <!-- Send button -->
    <circle cx="356" cy="39" r="20" fill="#2C2C2E"/>
    <!-- Arrow up icon -->
    <g transform="translate(348,29)">
      <path d="M8 16 L8 4 M3 9 L8 4 L13 9" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Session note -->
    <g transform="translate(0,74)">
      <text x="195" y="14" font-family="-apple-system,SF Pro Text,Helvetica Neue,Arial,sans-serif" font-size="11" font-weight="400" fill="#B0A090" text-anchor="middle">Unlimited refinements within this session</text>
      <!-- Infinity icon -->
      <g transform="translate(115,4)">
        <path d="M0 6 Q0 0 6 0 Q12 0 12 6 Q12 12 6 12 Q0 12 0 6" fill="none" stroke="#C0A890" stroke-width="0" opacity="0"/>
      </g>
    </g>

    <!-- Home indicator -->
    <rect x="140" y="118" width="110" height="5" rx="2.5" fill="#D4C4B4"/>
  </g>

  <!-- ==================== PROGRESS DOTS ==================== -->
  <g transform="translate(140,640)">
    <!-- These are subtle, behind the chips area -->
  </g>
</svg>