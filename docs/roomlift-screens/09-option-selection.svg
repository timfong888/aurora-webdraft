<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <!-- Warm background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F4"/>
      <stop offset="100%" stop-color="#F3EDE6"/>
    </linearGradient>
    <!-- Primary button gradient -->
    <linearGradient id="btnPrimary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="100%" stop-color="#5A9CFF"/>
    </linearGradient>
    <!-- Selected card border gradient -->
    <linearGradient id="selectedBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34C759"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <!-- Room A scene -->
    <linearGradient id="roomAWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#EDE5DA"/>
    </linearGradient>
    <linearGradient id="roomAFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A882"/>
      <stop offset="100%" stop-color="#B89970"/>
    </linearGradient>
    <!-- Room B scene -->
    <linearGradient id="roomBWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D5C4"/>
      <stop offset="100%" stop-color="#DECCA"/>
    </linearGradient>
    <linearGradient id="roomBFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B6F4E"/>
      <stop offset="100%" stop-color="#7A6245"/>
    </linearGradient>
    <!-- Card shadow filter -->
    <filter id="cardShadow" x="-4%" y="-2%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#00000012"/>
    </filter>
    <filter id="cardShadowSelected" x="-4%" y="-2%" width="108%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#34C75930"/>
    </filter>
    <!-- Checkmark badge shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000020"/>
    </filter>
    <!-- Dimmed overlay for Option B -->
    <clipPath id="cardBClip">
      <rect x="20" y="454" width="350" height="222" rx="16"/>
    </clipPath>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="390" height="844" rx="44" fill="url(#bgGrad)"/>
  <!-- Phone outline -->
  <rect x="0.5" y="0.5" width="389" height="843" rx="44" fill="none" stroke="#D1C9BE" stroke-width="1"/>

  <!-- ==================== STATUS BAR ==================== -->
  <g id="statusBar">
    <!-- Time -->
    <text x="36" y="19" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E" text-anchor="start">9:41</text>
    <!-- Dynamic Island -->
    <rect x="148" y="4" width="94" height="28" rx="14" fill="#1C1C1E"/>
    <!-- Signal bars -->
    <g transform="translate(298, 7)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#1C1C1E"/>
      <rect x="5" y="6" width="3" height="6" rx="0.5" fill="#1C1C1E"/>
      <rect x="10" y="3" width="3" height="9" rx="0.5" fill="#1C1C1E"/>
      <rect x="15" y="0" width="3" height="12" rx="0.5" fill="#1C1C1E"/>
    </g>
    <!-- WiFi -->
    <g transform="translate(322, 6)">
      <path d="M4 10 L8 4 L12 10" fill="none" stroke="#1C1C1E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8" cy="10" r="1.2" fill="#1C1C1E"/>
    </g>
    <!-- Battery -->
    <g transform="translate(344, 7)">
      <rect x="0" y="0" width="24" height="11" rx="3" fill="none" stroke="#1C1C1E" stroke-width="1"/>
      <rect x="24.5" y="3" width="1.5" height="5" rx="0.75" fill="#1C1C1E"/>
      <rect x="1.5" y="1.5" width="20" height="8" rx="1.5" fill="#34C759"/>
    </g>
  </g>

  <!-- ==================== HEADER ==================== -->
  <g id="header" transform="translate(0, 54)">
    <!-- Back arrow -->
    <g transform="translate(20, 2)" cursor="pointer">
      <circle cx="16" cy="14" r="18" fill="transparent"/>
      <path d="M22 14 L10 14 M10 14 L16 8 M10 14 L16 20" fill="none" stroke="#3478F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Title -->
    <text x="195" y="20" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="18" font-weight="600" fill="#1C1C1E" text-anchor="middle">Compare Options</text>
    <!-- Step indicator -->
    <text x="350" y="20" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#8E8E93" text-anchor="end">9 of 12</text>
  </g>

  <!-- ==================== INSTRUCTION TEXT ==================== -->
  <text x="20" y="108" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="400" fill="#6B6B70">Select the designs you'd like to keep</text>

  <!-- ==================== OPTION A CARD (SELECTED) ==================== -->
  <g id="optionA">
    <!-- Card background with green highlight -->
    <rect x="20" y="128" width="350" height="222" rx="16" fill="#FFFFFF" filter="url(#cardShadowSelected)" stroke="#34C759" stroke-width="2"/>

    <!-- Thumbnail area -->
    <g clip-path="url(#cardAClipInner)">
      <clipPath id="cardAClipInner">
        <rect x="28" y="136" width="178" height="140" rx="12"/>
      </clipPath>
      <!-- Room scene - Modern Minimalist -->
      <rect x="28" y="136" width="178" height="140" rx="12" fill="url(#roomAWall)"/>
      <!-- Floor -->
      <rect x="28" y="216" width="178" height="60" fill="url(#roomAFloor)"/>
      <!-- Window -->
      <rect x="68" y="148" width="40" height="50" rx="2" fill="#D4E8F0" stroke="#C8B9A8" stroke-width="1.5"/>
      <line x1="88" y1="148" x2="88" y2="198" stroke="#C8B9A8" stroke-width="1"/>
      <line x1="68" y1="173" x2="108" y2="173" stroke="#C8B9A8" stroke-width="1"/>
      <!-- Sofa - minimalist gray -->
      <rect x="46" y="228" width="64" height="24" rx="4" fill="#9E9E9E"/>
      <rect x="42" y="222" width="72" height="10" rx="3" fill="#BDBDBD"/>
      <!-- Side table -->
      <rect x="130" y="234" width="22" height="18" rx="2" fill="#D4C4B0"/>
      <!-- Plant -->
      <circle cx="158" cy="218" r="10" fill="#81C784"/>
      <circle cx="164" cy="212" r="8" fill="#66BB6A"/>
      <rect x="156" y="228" width="5" height="12" rx="1" fill="#A1887F"/>
      <!-- Lamp -->
      <rect x="140" y="200" width="3" height="34" fill="#E0E0E0"/>
      <ellipse cx="141.5" cy="198" rx="10" ry="6" fill="#FFF9C4"/>
    </g>

    <!-- Option label badge -->
    <rect x="36" y="144" width="28" height="20" rx="6" fill="#34C759" opacity="0.9"/>
    <text x="50" y="158" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>

    <!-- Text content area -->
    <g transform="translate(218, 140)">
      <text x="0" y="14" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Modern</text>
      <text x="0" y="33" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Minimalist</text>

      <!-- Stats -->
      <g transform="translate(0, 48)">
        <!-- Reorganize -->
        <g>
          <rect x="0" y="0" width="56" height="22" rx="6" fill="#F0EDE8"/>
          <text x="28" y="15" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="10" font-weight="500" fill="#6B6B70" text-anchor="middle">4 reorg</text>
        </g>
        <!-- Purchases -->
        <g>
          <rect x="62" y="0" width="62" height="22" rx="6" fill="#F0EDE8"/>
          <text x="93" y="15" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="10" font-weight="500" fill="#6B6B70" text-anchor="middle">2 purch</text>
        </g>
      </g>

      <!-- Cost estimate -->
      <g transform="translate(0, 78)">
        <text x="0" y="12" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="20" font-weight="700" fill="#1C1C1E">$189</text>
        <text x="50" y="12" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="12" font-weight="400" fill="#8E8E93"> est.</text>
      </g>

      <!-- Heart icon -->
      <g transform="translate(118, 102)">
        <path d="M10 18 C10 18 2 12 2 7 C2 4 4.5 2 7 2 C8.5 2 10 3 10 5 C10 3 11.5 2 13 2 C15.5 2 18 4 18 7 C18 12 10 18 10 18Z" fill="#FF6B8A" stroke="none"/>
      </g>
    </g>

    <!-- Selected checkmark badge -->
    <g transform="translate(338, 128)" filter="url(#badgeShadow)">
      <circle cx="16" cy="16" r="16" fill="#34C759"/>
      <path d="M9 16 L14 21 L23 11" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bottom section with full stats text -->
    <g transform="translate(28, 286)">
      <text x="0" y="10" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="12" font-weight="400" fill="#8E8E93">4 reorganize  ·  2 purchases  ·  $189 est.</text>
      <!-- Selected indicator -->
      <rect x="246" y="-2" width="66" height="22" rx="11" fill="#E8F8ED"/>
      <text x="279" y="12" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="600" fill="#34C759" text-anchor="middle">Selected</text>
    </g>

    <!-- Subtle inner glow for selection -->
    <rect x="21" y="129" width="348" height="220" rx="15" fill="none" stroke="#34C75920" stroke-width="4"/>
  </g>

  <!-- ==================== OPTION B CARD (UNSELECTED / DIMMED) ==================== -->
  <g id="optionB">
    <!-- Card background -->
    <rect x="20" y="370" width="350" height="222" rx="16" fill="#FFFFFF" filter="url(#cardShadow)" stroke="#E5E0DA" stroke-width="1"/>

    <!-- Thumbnail area -->
    <g>
      <clipPath id="cardBClipInner">
        <rect x="28" y="378" width="178" height="140" rx="12"/>
      </clipPath>
      <g clip-path="url(#cardBClipInner)">
        <!-- Room scene - Warm & Cozy -->
        <rect x="28" y="378" width="178" height="140" rx="12" fill="#E8D5C4"/>
        <!-- Floor - darker wood -->
        <rect x="28" y="458" width="178" height="60" fill="url(#roomBFloor)"/>
        <!-- Window with curtains -->
        <rect x="68" y="390" width="40" height="50" rx="2" fill="#B8D8E8" stroke="#A08060" stroke-width="1.5"/>
        <line x1="88" y1="390" x2="88" y2="440" stroke="#A08060" stroke-width="1"/>
        <line x1="68" y1="415" x2="108" y2="415" stroke="#A08060" stroke-width="1"/>
        <!-- Curtains -->
        <rect x="58" y="388" width="14" height="54" rx="2" fill="#C0785C" opacity="0.7"/>
        <rect x="106" y="388" width="14" height="54" rx="2" fill="#C0785C" opacity="0.7"/>
        <!-- Big cozy couch -->
        <rect x="38" y="468" width="80" height="28" rx="6" fill="#C0785C"/>
        <rect x="34" y="462" width="88" height="12" rx="4" fill="#D4926E"/>
        <!-- Throw pillows -->
        <rect x="44" y="464" width="14" height="10" rx="3" fill="#E8B878"/>
        <rect x="98" y="464" width="14" height="10" rx="3" fill="#D4E8C0"/>
        <!-- Coffee table -->
        <rect x="130" y="480" width="30" height="14" rx="2" fill="#8B6F4E"/>
        <!-- Rug -->
        <ellipse cx="105" cy="498" rx="40" ry="10" fill="#D4926E" opacity="0.4"/>
        <!-- Bookshelf -->
        <rect x="150" y="400" width="30" height="56" rx="2" fill="#A08060"/>
        <rect x="152" y="404" width="26" height="8" fill="#D4C4B0"/>
        <rect x="152" y="416" width="26" height="8" fill="#C8B0A0"/>
        <rect x="152" y="428" width="26" height="8" fill="#D4C4B0"/>
        <rect x="152" y="440" width="26" height="8" fill="#C8B0A0"/>
      </g>

      <!-- Dimmed overlay -->
      <rect x="28" y="378" width="178" height="140" rx="12" fill="#FFFFFF" opacity="0.35"/>
    </g>

    <!-- Option label badge -->
    <rect x="36" y="386" width="28" height="20" rx="6" fill="#8E8E93" opacity="0.8"/>
    <text x="50" y="400" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>

    <!-- Text content area -->
    <g transform="translate(218, 382)">
      <text x="0" y="14" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="16" font-weight="600" fill="#8E8E93">Warm &amp; Cozy</text>

      <!-- Stats -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="56" height="22" rx="6" fill="#F0EDE8"/>
        <text x="28" y="15" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="10" font-weight="500" fill="#AEAEB2" text-anchor="middle">3 reorg</text>
        <rect x="62" y="0" width="62" height="22" rx="6" fill="#F0EDE8"/>
        <text x="93" y="15" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="10" font-weight="500" fill="#AEAEB2" text-anchor="middle">3 purch</text>
      </g>

      <!-- Cost estimate -->
      <g transform="translate(0, 60)">
        <text x="0" y="12" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="20" font-weight="700" fill="#AEAEB2">$267</text>
        <text x="50" y="12" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="12" font-weight="400" fill="#C7C7CC"> est.</text>
      </g>

      <!-- Heart icon (unfilled) -->
      <g transform="translate(118, 84)">
        <path d="M10 18 C10 18 2 12 2 7 C2 4 4.5 2 7 2 C8.5 2 10 3 10 5 C10 3 11.5 2 13 2 C15.5 2 18 4 18 7 C18 12 10 18 10 18Z" fill="none" stroke="#C7C7CC" stroke-width="1.5"/>
      </g>
    </g>

    <!-- X overlay badge (not selected) -->
    <g transform="translate(338, 370)">
      <circle cx="16" cy="16" r="16" fill="#E5E0DA"/>
      <path d="M11 11 L21 21 M21 11 L11 21" fill="none" stroke="#AEAEB2" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Bottom section with full stats text -->
    <g transform="translate(28, 528)">
      <text x="0" y="10" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="12" font-weight="400" fill="#C7C7CC">3 reorganize  ·  3 purchases  ·  $267 est.</text>
      <rect x="236" y="-2" width="76" height="22" rx="11" fill="#F0EDE8"/>
      <text x="274" y="12" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="600" fill="#AEAEB2" text-anchor="middle">Not selected</text>
    </g>
  </g>

  <!-- ==================== COMPARISON SUMMARY ==================== -->
  <g id="comparison" transform="translate(20, 612)">
    <rect x="0" y="0" width="350" height="72" rx="14" fill="#FFFFFF" stroke="#E5E0DA" stroke-width="1"/>

    <!-- Option A summary -->
    <g transform="translate(16, 14)">
      <circle cx="6" cy="7" r="6" fill="#34C759"/>
      <text x="3.5" y="10.5" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">A</text>
      <text x="18" y="11" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#1C1C1E">Option A</text>
      <text x="82" y="11" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="400" fill="#6B6B70">  —  fewer purchases, lower cost</text>
    </g>

    <!-- Option B summary -->
    <g transform="translate(16, 42)">
      <circle cx="6" cy="7" r="6" fill="#AEAEB2"/>
      <text x="4" y="10.5" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">B</text>
      <text x="18" y="11" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#8E8E93">Option B</text>
      <text x="82" y="11" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="400" fill="#AEAEB2">  —  more dramatic transformation</text>
    </g>
  </g>

  <!-- ==================== ACTION BUTTONS ==================== -->
  <g id="actionButtons" transform="translate(0, 706)">
    <!-- Refine Selected (secondary) -->
    <rect x="20" y="0" width="170" height="50" rx="14" fill="#F0EDE8" stroke="#D1C9BE" stroke-width="1"/>
    <text x="105" y="30" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#6B6B70" text-anchor="middle">Refine Selected</text>

    <!-- Continue with Option A (primary) -->
    <rect x="200" y="0" width="170" height="50" rx="14" fill="url(#btnPrimary)"/>
    <text x="285" y="24" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Continue with</text>
    <text x="285" y="40" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Option A</text>
  </g>

  <!-- ==================== HOME INDICATOR ==================== -->
  <rect x="140" y="822" width="110" height="5" rx="2.5" fill="#1C1C1E" opacity="0.2"/>
</svg>