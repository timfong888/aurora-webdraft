<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <!-- Camera button gradient -->
    <radialGradient id="captureBtn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </radialGradient>
    <!-- Subtle vignette for camera feel -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.35)"/>
    </radialGradient>
    <!-- Thumbnail image gradient to simulate a room photo -->
    <linearGradient id="thumbPhoto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="30%" stop-color="#A0926B"/>
      <stop offset="60%" stop-color="#6B8E7B"/>
      <stop offset="100%" stop-color="#5A7A6A"/>
    </linearGradient>
    <!-- Viewfinder overlay gradient -->
    <linearGradient id="viewfinderOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.4)"/>
      <stop offset="15%" stop-color="transparent"/>
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </linearGradient>
    <clipPath id="phoneClip">
      <rect x="0" y="0" width="390" height="844" rx="44" ry="44"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Phone frame -->
  <rect x="0" y="0" width="390" height="844" rx="44" ry="44" fill="#000000"/>

  <g clip-path="url(#phoneClip)">

    <!-- Dark camera background -->
    <rect x="0" y="0" width="390" height="844" fill="#1a1a1a"/>

    <!-- Simulated camera feed (dark room-like background) -->
    <rect x="0" y="100" width="390" height="580" fill="#2a2a2a"/>
    <!-- Subtle room shapes to simulate camera view -->
    <rect x="40" y="200" width="310" height="280" fill="#2e2e2e" rx="2"/>
    <rect x="60" y="220" width="120" height="160" fill="#333333" rx="1"/>
    <rect x="200" y="240" width="130" height="120" fill="#303030" rx="1"/>
    <rect x="80" y="400" width="230" height="60" fill="#2c2c2c" rx="1"/>
    <!-- Vignette overlay -->
    <rect x="0" y="100" width="390" height="580" fill="url(#vignette)"/>

    <!-- ==================== STATUS BAR ==================== -->
    <!-- Time -->
    <text x="36" y="22" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start" dominant-baseline="central" dy="16">9:41</text>

    <!-- Dynamic Island -->
    <rect x="139" y="10" width="112" height="32" rx="16" ry="16" fill="#000000"/>

    <!-- Signal bars -->
    <g transform="translate(283, 18)">
      <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#ffffff"/>
      <rect x="5" y="5" width="3" height="7" rx="0.5" fill="#ffffff"/>
      <rect x="10" y="2" width="3" height="10" rx="0.5" fill="#ffffff"/>
      <rect x="15" y="0" width="3" height="12" rx="0.5" fill="#ffffff"/>
    </g>
    <!-- WiFi icon -->
    <g transform="translate(310, 18)">
      <path d="M4 10 L8 4 L12 10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8" cy="11" r="1.2" fill="#ffffff"/>
    </g>
    <!-- Battery -->
    <g transform="translate(334, 20)">
      <rect x="0" y="0" width="25" height="12" rx="3" ry="3" fill="none" stroke="#ffffff" stroke-width="1"/>
      <rect x="25" y="3" width="2" height="6" rx="1" fill="#ffffff"/>
      <rect x="2" y="2" width="17" height="8" rx="1.5" fill="#4CD964"/>
    </g>

    <!-- ==================== HEADER BAR ==================== -->
    <rect x="0" y="48" width="390" height="52" fill="rgba(0,0,0,0.7)"/>

    <!-- Back arrow -->
    <g transform="translate(20, 74)">
      <path d="M12 0 L0 0 M0 0 L6 -6 M0 0 L6 6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Header title -->
    <text x="195" y="78" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Capture Your Room</text>

    <!-- Step counter -->
    <rect x="326" y="62" width="48" height="24" rx="12" fill="rgba(255,255,255,0.15)"/>
    <text x="350" y="78" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.8)" text-anchor="middle">2 of 3</text>

    <!-- ==================== VIEWFINDER AREA ==================== -->
    <!-- Viewfinder boundary -->
    <rect x="20" y="110" width="350" height="470" fill="transparent"/>

    <!-- Grid overlay lines (rule of thirds) -->
    <line x1="137" y1="110" x2="137" y2="580" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
    <line x1="253" y1="110" x2="253" y2="580" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
    <line x1="20" y1="267" x2="370" y2="267" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
    <line x1="20" y1="423" x2="370" y2="423" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>

    <!-- Corner brackets - Top Left -->
    <path d="M20 140 L20 110 L50 110" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Corner brackets - Top Right -->
    <path d="M340 110 L370 110 L370 140" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Corner brackets - Bottom Left -->
    <path d="M20 550 L20 580 L50 580" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Corner brackets - Bottom Right -->
    <path d="M340 580 L370 580 L370 550" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ==================== PHOTO PERSPECTIVE INDICATOR ==================== -->
    <g transform="translate(195, 130)">
      <!-- Connecting line between dots -->
      <line x1="-60" y1="0" x2="60" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

      <!-- Dot 1 - Done (filled with checkmark) -->
      <circle cx="-60" cy="0" r="12" fill="#4CD964"/>
      <path d="M-65 0 L-62 3 L-55 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Dot 2 - Current (highlighted with ring) -->
      <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>

      <!-- Dot 3 - Remaining (empty) -->
      <circle cx="60" cy="0" r="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

      <!-- Labels -->
      <text x="-60" y="28" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="500" fill="#4CD964" text-anchor="middle">Wide</text>
      <text x="0" y="28" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Detail</text>
      <text x="60" y="28" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.4)" text-anchor="middle">Corner</text>
    </g>

    <!-- ==================== GUIDANCE OVERLAY TEXT ==================== -->
    <!-- Frosted pill background for guidance text -->
    <rect x="55" y="330" width="280" height="44" rx="22" fill="rgba(0,0,0,0.55)"/>
    <text x="195" y="357" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">Stand in the doorway facing</text>
    <text x="195" y="374" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle" opacity="0">the center</text>

    <!-- Re-do guidance as single pill with two lines -->
    <rect x="55" y="330" width="280" height="52" rx="22" fill="rgba(0,0,0,0.55)"/>
    <text x="195" y="352" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">Stand in the doorway</text>
    <text x="195" y="372" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.75)" text-anchor="middle">facing the center</text>

    <!-- Animated-look focus crosshair in center -->
    <g transform="translate(195, 345)" opacity="0.3">
      <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    </g>

    <!-- ==================== PRIVACY BANNER ==================== -->
    <rect x="20" y="540" width="350" height="38" rx="8" fill="rgba(0,0,0,0.6)"/>
    <!-- Lock icon -->
    <g transform="translate(40, 559)">
      <rect x="-4" y="-2" width="8" height="7" rx="1.5" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
      <path d="M-2.5 -2 L-2.5 -5 Q-2.5 -8 0 -8 Q2.5 -8 2.5 -5 L2.5 -2" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <text x="55" y="563" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="400" fill="rgba(255,255,255,0.6)">Your photos are yours — used only to generate your room plan</text>

    <!-- ==================== BOTTOM CONTROLS AREA ==================== -->
    <rect x="0" y="600" width="390" height="244" fill="#000000"/>

    <!-- Subtle separator line -->
    <line x1="0" y1="600" x2="390" y2="600" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- ==================== THUMBNAIL (Bottom Left) ==================== -->
    <g transform="translate(50, 660)">
      <!-- Thumbnail container -->
      <rect x="-28" y="-28" width="56" height="56" rx="10" fill="url(#thumbPhoto)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <!-- Simulated room details in thumbnail -->
      <rect x="-20" y="-15" width="15" height="22" fill="rgba(255,255,255,0.15)" rx="1"/>
      <rect x="0" y="-10" width="18" height="14" fill="rgba(255,255,255,0.1)" rx="1"/>
      <rect x="-18" y="10" width="34" height="8" fill="rgba(255,255,255,0.08)" rx="1"/>
      <!-- Checkmark badge -->
      <circle cx="22" cy="-22" r="11" fill="#4CD964"/>
      <path d="M17 -22 L20 -19 L27 -26" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ==================== CAPTURE BUTTON (Center) ==================== -->
    <g transform="translate(195, 660)">
      <!-- Outer ring -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#ffffff" stroke-width="4"/>
      <!-- Inner button -->
      <circle cx="0" cy="0" r="31" fill="url(#captureBtn)"/>
      <!-- Subtle inner shadow for depth -->
      <circle cx="0" cy="0" r="31" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
      <!-- Very subtle highlight on top -->
      <ellipse cx="0" cy="-12" rx="18" ry="10" fill="rgba(255,255,255,0.15)"/>
    </g>

    <!-- ==================== SKIP BUTTON (Bottom Right) ==================== -->
    <text x="340" y="665" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.55)" text-anchor="middle">Skip</text>

    <!-- ==================== BOTTOM HINT TEXT ==================== -->
    <text x="195" y="730" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.35)" text-anchor="middle">Hold steady for best results</text>

    <!-- ==================== HOME INDICATOR ==================== -->
    <rect x="128" y="814" width="134" height="5" rx="2.5" fill="rgba(255,255,255,0.25)"/>

  </g>

  <!-- Phone border for realism -->
  <rect x="0" y="0" width="390" height="844" rx="44" ry="44" fill="none" stroke="#333333" stroke-width="1"/>
</svg>