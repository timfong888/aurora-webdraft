<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFBFD"/>
      <stop offset="100%" stop-color="#F0F2F5"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#3A7BC8"/>
    </linearGradient>
    <linearGradient id="heroLeftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8D5C4"/>
      <stop offset="100%" stop-color="#D4C0AC"/>
    </linearGradient>
    <linearGradient id="heroRightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F4EC"/>
      <stop offset="100%" stop-color="#D4EDDC"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#2ECC71"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A90D9" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#2ECC71" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4A90D9" stop-opacity="0.08"/>
    </linearGradient>
    <!-- Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="btnShadow" x="-5%" y="-10%" width="110%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#4A90D9" flood-opacity="0.3"/>
    </filter>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4A90D9" flood-opacity="0.15"/>
    </filter>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.04"/>
    </filter>
    <!-- Clip for hero illustration -->
    <clipPath id="heroClip">
      <rect x="35" y="248" width="320" height="220" rx="16"/>
    </clipPath>
    <!-- Diagonal clip for before side -->
    <clipPath id="beforeClip">
      <polygon points="35,248 225,248 165,468 35,468"/>
    </clipPath>
    <!-- Diagonal clip for after side -->
    <clipPath id="afterClip">
      <polygon points="225,248 355,248 355,468 165,468"/>
    </clipPath>
  </defs>

  <!-- Phone frame background -->
  <rect width="390" height="844" rx="44" fill="url(#bgGrad)"/>

  <!-- Subtle top shimmer -->
  <ellipse cx="195" cy="0" rx="250" ry="200" fill="url(#shimmer)" opacity="0.7"/>

  <!-- ==================== STATUS BAR ==================== -->
  <!-- Time -->
  <text x="36" y="22" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E" letter-spacing="0.2">9:41</text>

  <!-- Dynamic Island placeholder -->
  <rect x="124" y="4" width="142" height="32" rx="16" fill="#1C1C1E"/>

  <!-- Signal bars -->
  <g transform="translate(284, 10)">
    <rect x="0" y="8" width="3.5" height="4" rx="1" fill="#1C1C1E"/>
    <rect x="5" y="5.5" width="3.5" height="6.5" rx="1" fill="#1C1C1E"/>
    <rect x="10" y="3" width="3.5" height="9" rx="1" fill="#1C1C1E"/>
    <rect x="15" y="0" width="3.5" height="12" rx="1" fill="#1C1C1E"/>
  </g>

  <!-- WiFi icon -->
  <g transform="translate(312, 10)">
    <path d="M8,11 a1.5,1.5 0 1,1 0.01,0" fill="#1C1C1E"/>
    <path d="M4,8 Q8,4 12,8" stroke="#1C1C1E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M1,5 Q8,0 15,5" stroke="#1C1C1E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Battery -->
  <g transform="translate(338, 10)">
    <rect x="0" y="1" width="24" height="11" rx="3" stroke="#1C1C1E" stroke-width="1.2" fill="none"/>
    <rect x="24.5" y="4" width="2" height="5" rx="1" fill="#1C1C1E" opacity="0.4"/>
    <rect x="1.5" y="2.5" width="20" height="8" rx="1.5" fill="#2ECC71"/>
  </g>

  <!-- ==================== LOGO AREA ==================== -->
  <!-- Logo icon - small house/room icon -->
  <g transform="translate(152, 62)" filter="url(#logoShadow)">
    <rect x="6" y="16" width="28" height="22" rx="3" fill="#4A90D9" opacity="0.15"/>
    <path d="M20,6 L36,18 L36,38 L4,38 L4,18 Z" fill="none" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="14" y="24" width="12" height="14" rx="2" fill="none" stroke="url(#logoGrad)" stroke-width="2"/>
    <line x1="20" y1="24" x2="20" y2="38" stroke="url(#logoGrad)" stroke-width="1.5"/>
    <!-- Sparkle on roof -->
    <circle cx="30" cy="12" r="2" fill="#2ECC71" opacity="0.6"/>
    <circle cx="32" cy="9" r="1" fill="#2ECC71" opacity="0.4"/>
  </g>

  <!-- App name -->
  <text x="195" y="126" text-anchor="middle" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="36" font-weight="700" fill="#1C1C1E" letter-spacing="-0.5">
    Room<tspan fill="#4A90D9">lift</tspan>
  </text>

  <!-- Tagline -->
  <text x="195" y="156" text-anchor="middle" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="17" fill="#6B7280" letter-spacing="0.1">
    Transform your space. No designer needed.
  </text>

  <!-- ==================== HERO ILLUSTRATION ==================== -->
  <!-- Card container with shadow -->
  <rect x="35" y="188" width="320" height="282" rx="20" fill="white" filter="url(#cardShadow)"/>

  <!-- Illustration area background -->
  <rect x="43" y="196" width="304" height="220" rx="14" fill="#F5F0EB"/>

  <!-- === BEFORE SIDE (Left - messy) === -->
  <g clip-path="url(#heroClip)">
    <!-- Left background - warm/messy tone -->
    <rect x="35" y="248" width="160" height="220" fill="#F5EDE4"/>

    <!-- Floor -->
    <rect x="35" y="390" width="320" height="80" fill="#E0D5C8"/>

    <!-- Left wall color -->
    <rect x="35" y="248" width="160" height="142" fill="#EDE3D6"/>

    <!-- Messy couch (left side) -->
    <rect x="50" y="340" width="100" height="50" rx="6" fill="#B8956A"/>
    <rect x="45" y="330" width="30" height="20" rx="8" fill="#C4A27A" transform="rotate(-12,60,340)"/>
    <rect x="80" y="325" width="35" height="22" rx="8" fill="#C4A27A" transform="rotate(8,97,336)"/>
    <rect x="120" y="328" width="28" height="20" rx="8" fill="#C4A27A" transform="rotate(-5,134,338)"/>

    <!-- Scattered items on floor -->
    <rect x="55" y="395" width="25" height="18" rx="2" fill="#8B7355" transform="rotate(23,67,404)"/>
    <rect x="95" y="400" width="30" height="8" rx="2" fill="#9B8B70" transform="rotate(-15,110,404)"/>
    <circle cx="140" cy="405" r="8" fill="#A0522D" opacity="0.5"/>
    <rect x="60" y="410" width="15" height="12" rx="1" fill="#7B6B55" transform="rotate(35,67,416)"/>

    <!-- Messy shelf on wall -->
    <rect x="55" y="268" width="80" height="8" rx="2" fill="#A89070"/>
    <rect x="60" y="255" width="12" height="13" rx="1" fill="#C4A882" transform="rotate(8,66,261)"/>
    <rect x="78" y="258" width="18" height="10" rx="1" fill="#B89872"/>
    <rect x="100" y="252" width="10" height="16" rx="1" fill="#BFA88C" transform="rotate(-12,105,260)"/>
    <rect x="115" y="260" width="14" height="8" rx="1" fill="#C4A882" transform="rotate(5,122,264)"/>

    <!-- Crooked picture frame -->
    <rect x="70" y="290" width="40" height="30" rx="2" stroke="#8B7355" stroke-width="2" fill="#DDD0C0" transform="rotate(-8,90,305)"/>

    <!-- Pile of stuff -->
    <ellipse cx="130" cy="378" rx="20" ry="12" fill="#B89872" opacity="0.6"/>
    <rect x="120" y="365" width="22" height="15" rx="2" fill="#A08060" transform="rotate(15,131,372)"/>

    <!-- Diagonal divider line (before/after split) -->
    <line x1="225" y1="196" x2="165" y2="416" stroke="white" stroke-width="3"/>

    <!-- === AFTER SIDE (Right - organized) === -->
    <!-- Right background - clean/fresh tone -->
    <rect x="165" y="248" width="200" height="220" fill="#EFF8F2"/>

    <!-- Clean wall -->
    <rect x="165" y="248" width="200" height="142" fill="#E8F4EC"/>

    <!-- Organized modern sofa -->
    <rect x="220" y="345" width="110" height="42" rx="8" fill="#5BA88C"/>
    <rect x="218" y="335" width="30" height="18" rx="6" fill="#68B89A"/>
    <rect x="260" y="337" width="26" height="16" rx="6" fill="#68B89A"/>
    <rect x="300" y="335" width="30" height="18" rx="6" fill="#68B89A"/>
    <!-- Decorative pillow -->
    <rect x="240" y="340" width="18" height="14" rx="5" fill="#4A90D9" opacity="0.6"/>

    <!-- Clean floor -->
    <rect x="165" y="390" width="200" height="80" fill="#E0E8E2"/>

    <!-- Neat rug -->
    <rect x="225" y="392" width="100" height="30" rx="4" fill="#B5D8C7" opacity="0.5"/>

    <!-- Organized shelf -->
    <rect x="240" y="268" width="90" height="6" rx="2" fill="#7BAF95"/>
    <rect x="245" y="254" width="12" height="14" rx="2" fill="#A8D4BC"/>
    <rect x="262" y="256" width="14" height="12" rx="2" fill="#90C4A8"/>
    <rect x="281" y="252" width="10" height="16" rx="2" fill="#A8D4BC"/>
    <rect x="296" y="258" width="16" height="10" rx="2" fill="#7BAF95"/>
    <!-- Small plant on shelf -->
    <circle cx="318" cy="258" r="5" fill="#2ECC71" opacity="0.5"/>
    <rect x="316" y="262" width="4" height="6" rx="1" fill="#7BAF95"/>

    <!-- Straight picture frame -->
    <rect x="255" y="288" width="44" height="32" rx="3" stroke="#7BAF95" stroke-width="2" fill="#D4EDDC"/>
    <!-- Simple landscape inside frame -->
    <rect x="259" y="292" width="36" height="24" rx="1" fill="#E8F4EC"/>
    <circle cx="271" cy="300" r="4" fill="#FDB813" opacity="0.4"/>
    <path d="M259,312 Q270,300 280,308 Q290,298 295,312 L295,316 L259,316 Z" fill="#2ECC71" opacity="0.3"/>

    <!-- Small side table -->
    <rect x="340" y="370" width="18" height="20" rx="3" fill="#7BAF95"/>
    <rect x="338" y="368" width="22" height="4" rx="2" fill="#68A088"/>
    <!-- Plant on table -->
    <circle cx="349" cy="360" r="7" fill="#2ECC71" opacity="0.5"/>
    <circle cx="345" cy="357" r="5" fill="#27AE60" opacity="0.4"/>
    <rect x="347" y="362" width="4" height="6" rx="1" fill="#68A088"/>
  </g>

  <!-- "Before" label -->
  <rect x="52" y="204" width="56" height="22" rx="11" fill="#E8D5C4"/>
  <text x="80" y="219" text-anchor="middle" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="600" fill="#8B7355">Before</text>

  <!-- "After" label -->
  <rect x="282" y="204" width="56" height="22" rx="11" fill="#D4EDDC"/>
  <text x="310" y="219" text-anchor="middle" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="11" font-weight="600" fill="#2ECC71">After</text>

  <!-- Diagonal divider (on top of card) -->
  <line x1="225" y1="196" x2="165" y2="416" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Arrow icon in center of divider -->
  <circle cx="195" cy="306" r="16" fill="white" filter="url(#subtleShadow)"/>
  <path d="M188,306 L202,306 M198,301 L203,306 L198,311" stroke="#4A90D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Card bottom text -->
  <text x="195" y="450" text-anchor="middle" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="12" fill="#9CA3AF" letter-spacing="0.3">
    AI-powered room transformation
  </text>

  <!-- ==================== VALUE PROPS ==================== -->
  <!-- Prop 1: Camera -->
  <g transform="translate(50, 498)">
    <rect width="44" height="44" rx="12" fill="#EBF3FB"/>
    <g transform="translate(10, 10)">
      <rect x="2" y="6" width="20" height="14" rx="3" stroke="#4A90D9" stroke-width="1.8" fill="none"/>
      <circle cx="12" cy="13" r="4" stroke="#4A90D9" stroke-width="1.5" fill="none"/>
      <circle cx="12" cy="13" r="1.5" fill="#4A90D9"/>
      <rect x="5" y="8" width="3" height="2" rx="1" fill="#4A90D9" opacity="0.5"/>
    </g>
    <text x="56" y="18" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Snap 3 photos of your room</text>
    <text x="56" y="36" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="13" fill="#9CA3AF">Quick and easy capture</text>
  </g>

  <!-- Prop 2: Microphone -->
  <g transform="translate(50, 560)">
    <rect width="44" height="44" rx="12" fill="#E8F8EE"/>
    <g transform="translate(10, 8)">
      <rect x="8" y="2" width="8" height="14" rx="4" stroke="#2ECC71" stroke-width="1.8" fill="none"/>
      <path d="M4,13 Q4,22 12,22 Q20,22 20,13" stroke="#2ECC71" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <line x1="12" y1="22" x2="12" y2="27" stroke="#2ECC71" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="8" y1="27" x2="16" y2="27" stroke="#2ECC71" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="56" y="18" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Tell us your vision</text>
    <text x="56" y="36" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="13" fill="#9CA3AF">Describe your dream space</text>
  </g>

  <!-- Prop 3: Sparkle/Magic -->
  <g transform="translate(50, 622)">
    <rect width="44" height="44" rx="12" fill="#FFF8E6"/>
    <g transform="translate(10, 10)">
      <!-- Star/sparkle icon -->
      <path d="M12,2 L14,9 L21,9 L15.5,13.5 L17.5,21 L12,16 L6.5,21 L8.5,13.5 L3,9 L10,9 Z" fill="#F5A623" opacity="0.9"/>
      <circle cx="20" cy="4" r="2" fill="#F5A623" opacity="0.5"/>
      <circle cx="4" cy="5" r="1.5" fill="#F5A623" opacity="0.4"/>
    </g>
    <text x="56" y="18" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="16" font-weight="600" fill="#1C1C1E">Get instant design plans</text>
    <text x="56" y="36" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="13" fill="#9CA3AF">AI creates your blueprint</text>
  </g>

  <!-- ==================== CTA BUTTON ==================== -->
  <rect x="35" y="700" width="320" height="56" rx="16" fill="url(#ctaGrad)" filter="url(#btnShadow)"/>
  <!-- Button highlight -->
  <rect x="35" y="700" width="320" height="28" rx="16" fill="white" opacity="0.08"/>
  <text x="195" y="734" text-anchor="middle" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="17" font-weight="600" fill="white" letter-spacing="0.2">
    Get Started — First Room Free
  </text>

  <!-- ==================== SIGN IN LINK ==================== -->
  <text x="195" y="782" text-anchor="middle" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" fill="#6B7280">
    Already have an account? <tspan fill="#4A90D9" font-weight="500">Sign in</tspan>
  </text>

  <!-- ==================== BOTTOM TEXT ==================== -->
  <!-- Lock icon -->
  <g transform="translate(145, 806)">
    <rect x="2" y="5" width="10" height="8" rx="2" stroke="#9CA3AF" stroke-width="1.2" fill="none"/>
    <path d="M4,5 L4,3 Q4,0 7,0 Q10,0 10,3 L10,5" stroke="#9CA3AF" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <circle cx="7" cy="9.5" r="1.2" fill="#9CA3AF"/>
  </g>
  <text x="205" y="817" text-anchor="middle" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="12" fill="#B0B8C4" letter-spacing="0.2">
    No credit card required
  </text>

  <!-- ==================== HOME INDICATOR ==================== -->
  <rect x="147" y="830" width="96" height="4" rx="2" fill="#D1D5DB"/>
</svg>