<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <!-- Card shadow filter -->
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <!-- Slightly stronger shadow for the banner -->
    <filter id="bannerShadow" x="-4%" y="-4%" width="108%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#4A90D9" flood-opacity="0.12"/>
    </filter>
    <!-- Button shadow -->
    <filter id="btnShadow" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#4A90D9" flood-opacity="0.25"/>
    </filter>
    <!-- Tab bar shadow (top) -->
    <filter id="tabShadow" x="-2%" y="-20%" width="104%" height="130%">
      <feDropShadow dx="0" dy="-2" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <!-- Thumbnail placeholder gradient -->
    <linearGradient id="thumbGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8D5C4"/>
      <stop offset="100%" stop-color="#D4C0AE"/>
    </linearGradient>
    <linearGradient id="thumbGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8DFF0"/>
      <stop offset="100%" stop-color="#A8C8E0"/>
    </linearGradient>
    <linearGradient id="thumbGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D5DAE0"/>
      <stop offset="100%" stop-color="#BFC5CC"/>
    </linearGradient>
    <!-- Progress bar background -->
    <linearGradient id="progressBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8ECF0"/>
      <stop offset="100%" stop-color="#E0E4E8"/>
    </linearGradient>
    <!-- Progress bar fill -->
    <linearGradient id="progressFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#5BA0E9"/>
    </linearGradient>
    <!-- Add button gradient -->
    <linearGradient id="addBtnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BA0E9"/>
      <stop offset="100%" stop-color="#4A90D9"/>
    </linearGradient>
    <!-- Clip for phone frame -->
    <clipPath id="screenClip">
      <rect x="0" y="0" width="390" height="844" rx="44"/>
    </clipPath>
  </defs>

  <!-- Phone frame -->
  <rect x="0" y="0" width="390" height="844" rx="44" fill="#F8F9FA" stroke="#D1D5DB" stroke-width="1"/>

  <g clip-path="url(#screenClip)">

    <!-- ==================== STATUS BAR ==================== -->
    <rect x="0" y="0" width="390" height="54" fill="#FFFFFF"/>
    <!-- Time -->
    <text x="36" y="36" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E" letter-spacing="0.2">9:41</text>
    <!-- Dynamic Island / Notch area -->
    <rect x="138" y="8" width="114" height="30" rx="15" fill="#1C1C1E"/>
    <!-- Signal bars -->
    <g transform="translate(286, 22)">
      <rect x="0" y="6" width="3" height="4" rx="0.5" fill="#1C1C1E"/>
      <rect x="5" y="4" width="3" height="6" rx="0.5" fill="#1C1C1E"/>
      <rect x="10" y="2" width="3" height="8" rx="0.5" fill="#1C1C1E"/>
      <rect x="15" y="0" width="3" height="10" rx="0.5" fill="#1C1C1E"/>
    </g>
    <!-- WiFi icon -->
    <g transform="translate(312, 22)">
      <path d="M4 8.5 a1.5 1.5 0 1 1 3 0 a1.5 1.5 0 1 1 -3 0" fill="#1C1C1E"/>
      <path d="M2 5.5 Q5.5 2 9 5.5" stroke="#1C1C1E" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M-0.5 3 Q5.5 -1.5 11.5 3" stroke="#1C1C1E" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Battery -->
    <g transform="translate(336, 22)">
      <rect x="0" y="0" width="25" height="11" rx="2.5" stroke="#1C1C1E" stroke-width="1" fill="none"/>
      <rect x="2" y="2" width="19" height="7" rx="1" fill="#1C1C1E"/>
      <rect x="25.5" y="3" width="2" height="5" rx="1" fill="#1C1C1E"/>
    </g>

    <!-- ==================== HEADER ==================== -->
    <rect x="0" y="54" width="390" height="60" fill="#FFFFFF"/>
    <!-- Title -->
    <text x="24" y="93" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#1C1C1E" letter-spacing="-0.5">My Rooms</text>
    <!-- Settings gear icon -->
    <g transform="translate(345, 74)" fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="3.5"/>
      <path d="M10 1.5 l1.2 0 l0.5 2.1 l1.8 1 l2-0.7 l0.6 1 l-1.5 1.5 l0.15 2 l2 0.8 l0 1.2 l-2.1 0.5 l-1 1.8 l0.7 2 l-1 0.6 l-1.5-1.5 l-2 0.15 l-0.8 2 l-1.2 0 l-0.5-2.1 l-1.8-1 l-2 0.7 l-0.6-1 l1.5-1.5 l-0.15-2 l-2-0.8 l0-1.2 l2.1-0.5 l1-1.8 l-0.7-2 l1-0.6 l1.5 1.5 l2-0.15z"/>
    </g>
    <!-- Divider -->
    <line x1="0" y1="114" x2="390" y2="114" stroke="#F0F0F0" stroke-width="0.5"/>

    <!-- ==================== SCROLLABLE CONTENT AREA ==================== -->

    <!-- ===== Usage Banner Card ===== -->
    <rect x="20" y="130" width="350" height="105" rx="16" fill="#FFFFFF" filter="url(#bannerShadow)"/>
    <!-- Left accent bar -->
    <rect x="20" y="130" width="5" height="105" rx="2.5" fill="#4A90D9"/>
    <!-- Pack name label -->
    <text x="42" y="156" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#4A90D9" letter-spacing="0.8" text-transform="uppercase">HOME PACK</text>
    <!-- Main text -->
    <text x="42" y="180" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#1C1C1E">3 of 10 rooms used</text>
    <!-- Upgrade link -->
    <text x="310" y="156" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#4A90D9" text-anchor="end">Upgrade</text>
    <!-- Progress bar background -->
    <rect x="42" y="196" width="310" height="8" rx="4" fill="url(#progressBg)"/>
    <!-- Progress bar fill (30%) -->
    <rect x="42" y="196" width="93" height="8" rx="4" fill="url(#progressFill)"/>
    <!-- Usage dots -->
    <g transform="translate(42, 216)">
      <circle cx="3" cy="3" r="3" fill="#4A90D9"/>
      <circle cx="14" cy="3" r="3" fill="#4A90D9"/>
      <circle cx="25" cy="3" r="3" fill="#4A90D9"/>
      <circle cx="36" cy="3" r="3" fill="#E0E4E8"/>
      <circle cx="47" cy="3" r="3" fill="#E0E4E8"/>
      <circle cx="58" cy="3" r="3" fill="#E0E4E8"/>
      <circle cx="69" cy="3" r="3" fill="#E0E4E8"/>
      <circle cx="80" cy="3" r="3" fill="#E0E4E8"/>
      <circle cx="91" cy="3" r="3" fill="#E0E4E8"/>
      <circle cx="102" cy="3" r="3" fill="#E0E4E8"/>
    </g>

    <!-- ===== Add New Room Button ===== -->
    <rect x="20" y="254" width="350" height="54" rx="14" fill="url(#addBtnGrad)" filter="url(#btnShadow)"/>
    <!-- Plus icon -->
    <g transform="translate(143, 270)">
      <line x1="0" y1="11" x2="22" y2="11" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="11" y1="0" x2="11" y2="22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="174" y="288" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" letter-spacing="0.2">Add New Room</text>

    <!-- ===== Section Label ===== -->
    <text x="24" y="340" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#8E8E93" letter-spacing="0.8">RECENT ROOMS</text>

    <!-- ===== Room Card 1: Living Room ===== -->
    <rect x="20" y="356" width="350" height="88" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <!-- Thumbnail -->
    <rect x="36" y="372" width="56" height="56" rx="12" fill="url(#thumbGrad1)"/>
    <!-- Sofa icon inside thumbnail -->
    <g transform="translate(48, 388)">
      <rect x="0" y="8" width="32" height="14" rx="3" fill="#C4A882" opacity="0.8"/>
      <rect x="2" y="4" width="28" height="10" rx="4" fill="#D4B892" opacity="0.9"/>
      <rect x="-2" y="6" width="6" height="16" rx="2" fill="#C4A882" opacity="0.7"/>
      <rect x="28" y="6" width="6" height="16" rx="2" fill="#C4A882" opacity="0.7"/>
      <rect x="4" y="22" width="4" height="4" rx="1" fill="#B0906A" opacity="0.6"/>
      <rect x="24" y="22" width="4" height="4" rx="1" fill="#B0906A" opacity="0.6"/>
    </g>
    <!-- Room name -->
    <text x="108" y="392" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1C1E">Living Room</text>
    <!-- Status badge: Completed -->
    <rect x="108" y="402" width="82" height="22" rx="6" fill="#E8F8EE"/>
    <text x="118" y="417" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2ECC71">Completed</text>
    <!-- Checkmark in badge -->
    <g transform="translate(170, 408)">
      <path d="M0 4 L3 7 L8 0" stroke="#2ECC71" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Date -->
    <text x="320" y="392" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#8E8E93" text-anchor="end">Jul 28</text>
    <!-- Chevron -->
    <g transform="translate(336, 392)">
      <path d="M0 -6 L7 0 L0 6" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ===== Room Card 2: Kitchen ===== -->
    <rect x="20" y="460" width="350" height="88" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <!-- Thumbnail -->
    <rect x="36" y="476" width="56" height="56" rx="12" fill="url(#thumbGrad2)"/>
    <!-- Kitchen icon inside thumbnail -->
    <g transform="translate(49, 490)">
      <rect x="2" y="10" width="28" height="18" rx="2" fill="#8BB8D8" opacity="0.7"/>
      <rect x="4" y="6" width="24" height="6" rx="1" fill="#9CC8E8" opacity="0.8"/>
      <circle cx="10" cy="18" r="3" fill="#6FA0C0" opacity="0.6"/>
      <circle cx="22" cy="18" r="3" fill="#6FA0C0" opacity="0.6"/>
      <rect x="14" y="2" width="4" height="6" rx="1" fill="#AAD0EA" opacity="0.7"/>
    </g>
    <!-- Room name -->
    <text x="108" y="496" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1C1E">Kitchen</text>
    <!-- Status badge: In Progress -->
    <rect x="108" y="506" width="92" height="22" rx="6" fill="#E8F0FA"/>
    <text x="118" y="521" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#4A90D9">In Progress</text>
    <!-- Date -->
    <text x="320" y="496" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#8E8E93" text-anchor="end">Jul 30</text>
    <!-- Chevron -->
    <g transform="translate(336, 496)">
      <path d="M0 -6 L7 0 L0 6" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ===== Room Card 3: Bedroom ===== -->
    <rect x="20" y="564" width="350" height="88" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <!-- Thumbnail -->
    <rect x="36" y="580" width="56" height="56" rx="12" fill="url(#thumbGrad3)"/>
    <!-- Bed icon inside thumbnail -->
    <g transform="translate(48, 594)">
      <rect x="0" y="12" width="32" height="10" rx="2" fill="#AAB2BB" opacity="0.7"/>
      <rect x="2" y="6" width="12" height="8" rx="2" fill="#BCC4CC" opacity="0.8"/>
      <rect x="0" y="22" width="4" height="4" rx="1" fill="#99A3AD" opacity="0.6"/>
      <rect x="28" y="22" width="4" height="4" rx="1" fill="#99A3AD" opacity="0.6"/>
      <rect x="0" y="4" width="32" height="3" rx="1" fill="#CCD2D8" opacity="0.6"/>
    </g>
    <!-- Room name -->
    <text x="108" y="600" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1C1C1E">Bedroom</text>
    <!-- Status badge: New -->
    <rect x="108" y="610" width="50" height="22" rx="6" fill="#F0F0F5"/>
    <text x="122" y="625" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#8E8E93">New</text>
    <!-- Date -->
    <text x="320" y="600" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#8E8E93" text-anchor="end">Jul 31</text>
    <!-- Chevron -->
    <g transform="translate(336, 600)">
      <path d="M0 -6 L7 0 L0 6" stroke="#C7C7CC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ==================== BOTTOM TAB BAR ==================== -->
    <rect x="0" y="760" width="390" height="84" fill="#FFFFFF" filter="url(#tabShadow)"/>
    <line x1="0" y1="760" x2="390" y2="760" stroke="#E5E5EA" stroke-width="0.5"/>

    <!-- Tab 1: Home (active) -->
    <g transform="translate(36, 772)">
      <!-- House icon -->
      <g fill="#4A90D9" stroke="#4A90D9" stroke-width="0">
        <path d="M14 2 L2 12 L5 12 L5 22 L11 22 L11 16 L17 16 L17 22 L23 22 L23 12 L26 12 Z" fill="#4A90D9" stroke="none"/>
      </g>
      <text x="14" y="38" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#4A90D9" text-anchor="middle">Home</text>
      <!-- Active indicator dot -->
      <circle cx="14" cy="44" r="2" fill="#4A90D9"/>
    </g>

    <!-- Tab 2: Rooms -->
    <g transform="translate(128, 772)">
      <!-- Grid/rooms icon -->
      <g stroke="#8E8E93" stroke-width="1.8" fill="none">
        <rect x="2" y="2" width="9" height="9" rx="2"/>
        <rect x="15" y="2" width="9" height="9" rx="2"/>
        <rect x="2" y="15" width="9" height="9" rx="2"/>
        <rect x="15" y="15" width="9" height="9" rx="2"/>
      </g>
      <text x="14" y="38" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" fill="#8E8E93" text-anchor="middle">Rooms</text>
    </g>

    <!-- Tab 3: Share -->
    <g transform="translate(222, 772)">
      <!-- Share / export icon -->
      <g stroke="#8E8E93" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 L13 16"/>
        <path d="M8 7 L13 2 L18 7"/>
        <path d="M4 14 L4 22 Q4 24 6 24 L20 24 Q22 24 22 22 L22 14"/>
      </g>
      <text x="13" y="38" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" fill="#8E8E93" text-anchor="middle">Share</text>
    </g>

    <!-- Tab 4: Profile -->
    <g transform="translate(316, 772)">
      <!-- Person icon -->
      <g stroke="#8E8E93" stroke-width="1.8" fill="none">
        <circle cx="13" cy="8" r="5.5"/>
        <path d="M1 24 Q1 16 13 16 Q25 16 25 24"/>
      </g>
      <text x="13" y="38" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" fill="#8E8E93" text-anchor="middle">Profile</text>
    </g>

    <!-- Home indicator bar -->
    <rect x="128" y="826" width="134" height="5" rx="2.5" fill="#1C1C1E" opacity="0.2"/>

  </g>
</svg>