name: CodeRabbit → Linear Handoff

on:
  pull_request_review:
    types: [submitted]

jobs:
  notify-linear:
    # Only fire for CodeRabbit reviews (skip human reviews and other bots)
    if: github.event.review.user.login == 'coderabbitai[bot]'
    uses: timfong888/global-config/.github/workflows/coderabbit-to-linear-reusable.yml@main
    with:
      branch_name: ${{ github.event.pull_request.head.ref }}
      pr_url: ${{ github.event.pull_request.html_url }}
      pr_number: ${{ github.event.pull_request.number }}
      repo_full_name: ${{ github.repository }}
      review_state: ${{ github.event.review.state }}
      pr_body: ${{ github.event.pull_request.body }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
